<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웨이퍼 테스트 대시보드</title>
<style>
/* 디자인 토큰: 흰 바탕, #f5f5f5 카드 + #ddd 1px 선, 직각, 그림자 없음, 단색 섹션 라벨 블록, #202020 푸터 */
:root {
  color-scheme: light;
  --page: #ffffff;
  --surface: #f5f5f5;       /* 카드 */
  --soft: #ffffff;
  --elev: #dddddd;
  --ink: #333333;           /* 본문 글자 */
  --ink2: #444444;          /* 링크·보조 본문 */
  --muted: #666666;         /* 작은 보조 글자 (#f5f5f5 위에서 5:1 이상) */
  --line: #dddddd;          /* 카드·표 테두리 */
  --grid: #dddddd;          /* 차트 격자선 */
  --base: #aaaaaa;          /* 차트 축선 */
  --ring: #dddddd;
  --accent: #3956c1;        /* 섹션 라벨 블록, 활성 탭 */
  --pass: #d9d9d9; --bar: #257de0;
  --w1: #257de0; --w2: #f47230; --passdot: #b0b0b0;
  /* 데이터 마크 색: 밝은 면에서 검증된 단계. UI 강조색과 별개로 판독성을 위해 유지 */
  --c-crack: #257de0; --c-open_short: #f47230; --c-leakage: #00b894;
  --c-vth_shift: #f2a600; --c-particle: #ee7fac; --c-parametric: #008a17;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 300 16px/1.5 "Noto Sans KR", "Malgun Gothic", -apple-system, "Segoe UI", sans-serif; letter-spacing: -.5px; }
main { max-width: 1430px; margin: 0 auto; padding: 30px 24px 60px; }
h1 { font-size: 32px; line-height: 1.2; font-weight: 700; color: var(--ink); margin: 0 0 6px; }
h2 { font-weight: 700; }
.sub { color: var(--muted); margin: 0 0 30px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: 24px; }
/* 섹션 라벨 블록: 카드 위쪽에 붙는 단색 띠, 흰 굵은 글씨 */
h2.strip { background: var(--accent); color: #fff; margin: -24px -24px 20px; padding: 14px 24px; font-size: 20px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; margin-bottom: 12px; }
.seg { display: inline-flex; gap: 24px; }
.seg button { background: transparent; color: var(--muted); border: 0; border-bottom: 3px solid transparent; border-radius: 0; padding: 8px 2px; font: 700 15px/1.3 inherit; font-family: inherit; letter-spacing: -.5px; cursor: pointer; }
.seg button:hover { color: var(--accent); }
.seg button[aria-pressed="true"] { color: var(--accent); border-bottom-color: var(--accent); }
select { font: inherit; font-weight: 300; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 0; padding: 8px 12px; height: 42px; }
select:focus { outline: 0; border-color: var(--accent); }
label { color: var(--ink2); margin-right: 8px; font-weight: 700; font-size: 14px; }
button { font-family: inherit; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 0 0 16px; padding: 0; list-style: none; }
.legend button { background: none; border: 0; color: var(--ink2); font: inherit; font-weight: 300; cursor: pointer; padding: 2px 6px; border-radius: 0; display: inline-flex; align-items: center; gap: 8px; }
.legend button[aria-pressed="true"] { outline: 2px solid var(--accent); color: var(--ink); font-weight: 700; }
.legend button:hover { text-decoration: underline; }
.sw { width: 12px; height: 12px; border-radius: 0; display: inline-block; }
.hint { color: var(--muted); font-size: 13px; }
.grad { display: inline-block; width: 160px; height: 10px; border-radius: 0; vertical-align: middle; }
.cmp { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 30px; margin-bottom: 30px; }
.cmp .card .big { font-size: 36px; line-height: 1.15; font-weight: 700; color: var(--ink); }
.panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 30px; align-items: start; margin-bottom: 30px; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
.tile .k { color: var(--muted); font-size: 13px; font-weight: 700; }
.tile .v { font-size: 28px; line-height: 1.2; font-weight: 700; color: var(--ink); }
.rows { margin: 8px 0 16px; }
.rows .val { white-space: nowrap; }
.rows .r { display: grid; grid-template-columns: 96px 1fr 128px; gap: 8px; align-items: center; margin: 4px 0; }
.rows .track { height: 10px; background: var(--elev); border-radius: 0; }
.rows .fill { height: 10px; border-radius: 0; }
.rows .val { text-align: right; color: var(--ink2); font-variant-numeric: tabular-nums; }
h3 { font-size: 14px; color: var(--ink2); margin: 16px 0 4px; font-weight: 700; }
svg.map { width: 100%; height: auto; display: block; }
svg.map text { fill: var(--muted); font-size: 9px; letter-spacing: 0; }
.cell { stroke: none; }
.cell.dim { opacity: .18; }
#tip { position: fixed; z-index: 10; pointer-events: none; background: var(--soft); color: var(--ink);
  border: 1px solid var(--base); border-radius: 0; padding: 10px 12px; font-size: 13px; font-weight: 300; display: none; max-width: 340px; }
#tip b { font-weight: 700; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
th { color: var(--muted); font-weight: 700; font-size: 13px; }
td.n, th.n { text-align: right; }
.bad { font-weight: 700; color: var(--ink); }
#detail { margin-top: 30px; }
.ctl { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; margin: 8px 0 16px; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 30px; }
.mini h3 { margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font-size: 11px; letter-spacing: 0; }
svg.chart .ttl { font-size: 11px; }
.key { display: inline-block; width: 16px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 6px; }
.note { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
details { margin-top: 24px; }
summary { cursor: pointer; color: var(--ink2); font-weight: 700; font-size: 14px; }
summary:hover { text-decoration: underline; color: var(--accent); }
#detail button { background: var(--accent); color: #fff; border: 0; border-radius: 0; padding: 7px 16px; font: 700 13px/1 inherit; font-family: inherit; cursor: pointer; }
#detail button:hover { text-decoration: underline; }
/* 푸터: #202020 바탕, #999 글자 */
#wrapFooter { background: #202020; margin-top: 30px; }
#wrapFooter footer { max-width: 1430px; margin: 0 auto; color: #999; text-align: center; padding: 50px 24px; font-size: 15px; }
@media (max-width: 900px) { h1 { font-size: 26px; } .tiles { grid-template-columns: 1fr; } .panels, .mini { grid-template-columns: 1fr; } .seg { flex-wrap: wrap; gap: 8px 20px; } }
</style>
</head>
<body>
<main>
  <h1>웨이퍼 테스트 대시보드</h1>
  <p class="sub" id="sub"></p>

  <div class="cmp" id="cmp"></div>

  <div class="card" style="margin-bottom:16px">
    <div class="toolbar">
      <div class="seg" role="group" aria-label="맵 색 기준">
        <button id="mReason" aria-pressed="true">판정 사유</button>
        <button id="mMeasure" aria-pressed="false">측정 항목</button>
      </div>
      <span id="measureBox" hidden><label for="item">항목</label><select id="item"></select></span>
      <span class="hint" id="modeHint"></span>
    </div>
    <ul class="legend" id="legend"></ul>
  </div>

  <div class="panels" id="panels"></div>

  <div class="card" style="margin-bottom:16px" id="explore">
    <h2 class="strip">차트 탐색</h2>
    <div class="toolbar" style="margin-bottom:4px">
      <div class="seg" role="group" aria-label="차트 종류" id="chartType"></div>
    </div>
    <div class="ctl" id="chartCtl"></div>
    <ul class="legend" id="chartLegend"></ul>
    <div id="chartBox"></div>
    <p class="note" id="chartNote"></p>
    <details><summary>표로 보기</summary><div id="chartTable"></div></details>
  </div>

  <div class="card" id="detail"><span class="hint">맵에서 다이를 클릭하면 두 웨이퍼의 같은 위치 값과 같은 행·열 현황이 여기에 표시됩니다.</span></div>

  <details class="card"><summary>표로 보기 (사유 × zone 개수)</summary><div id="tables"></div></details>

</main>
<div id="wrapFooter"><footer><p>사유·합격 여부는 엑셀의 fail_type / pass_fail 값이며, 빌드 때 합격기준표로 재판정해 모든 줄이 같음을 확인했습니다. 「공정 이상」 판정 임계값은 아직 정해지지 않아 수치만 표시합니다.</p></footer></div>
<div id="tip" role="tooltip"></div>

// 합격기준표 (sim-data/templates/합격기준표.md). 기준표를 고치면 build 스크립트 RULES와 함께 고친다.

  { key: 'rc_ohm', label: '접촉저항', unit: 'Ω', rule: '15 이하', hi: 15, bad: v => v > 15, reason: 'open_short' },
  { key: 'ioff_na', label: '누설전류', unit: 'nA', rule: '10 이하', hi: 10, bad: v => v > 10, reason: 'leakage' },
  { key: 'vth_v', label: '문턱전압', unit: 'V', rule: '0.38 ~ 0.52', lo: 0.38, hi: 0.52, bad: v => !(v >= 0.38 && v <= 0.52), reason: 'vth_shift' },
  { key: 'particle_cnt', label: '먼지 개수', unit: '개', rule: '4 이하', hi: 4, bad: v => v > 4, reason: 'particle' },

];

];

// ---- 통계 ----
function stats(w) {
  const dies = W[w].dies, n = dies.length;
  const fail = dies.filter(d => d.pass_fail === 'FAIL').length;
  const byZone = {}, byReason = {};
  ZONES.forEach(z => byZone[z] = { n: 0, f: 0 });

    if (d.pass_fail === 'FAIL') { byZone[d.zone].f++; byReason[d.fail_type] = (byReason[d.fail_type] || 0) + 1; }
  });
  return { n, fail, pass: n - fail, byZone, byReason };
}
const ST = Object.fromEntries(IDS.map(id => [id, stats(id)]));

// ---- 연속 색 (파랑 단색, 밝음→어두움). 어두운 화면에서는 반대로 해서 큰 값이 눈에 띄게 한다 ----
const RAMP = ['#cce3fd', '#9dc8f7', '#6aabf1', '#338ced', '#2370cd', '#1757ac', '#0e3d7e'];
function hex(c) { return [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); }
function rampAt(t) {
  t = Math.max(0, Math.min(1, t));
  if (isDark()) t = 1 - t;
  const p = t * (RAMP.length - 1), i = Math.min(RAMP.length - 2, Math.floor(p)), f = p - i;
  const a = hex(RAMP[i]), b = hex(RAMP[i + 1]);
  return 'rgb(' + a.map((x, j) => Math.round(x + (b[j] - x) * f)).join(',') + ')';
}
const scaleCache = {};
function scaleFor(key) {
  if (scaleCache[key]) return scaleCache[key];

    'aria-label': id + ' 웨이퍼 맵. 다이 ' + W[id].dies.length + '개. 표로 보기에서 개수를 확인할 수 있습니다.' });
  const gx = x => PAD_L + (x - MIN) * CELL;
  const gy = y => PAD_T + (N - 1 - (y - MIN)) * CELL;   // y가 클수록 위
  [-14, -7, 0, 7, 13].forEach(v => {
    const t = s('text', { x: gx(v) + CELL / 2, y: PAD_T + N * CELL + 14, 'text-anchor': 'middle' }); t.textContent = v; svg.appendChild(t);
    const u = s('text', { x: PAD_L - 5, y: gy(v) + CELL / 2 + 3, 'text-anchor': 'end' }); u.textContent = v; svg.appendChild(u);
  });
  const band = s('g'); svg.appendChild(band);
  const g = s('g'); svg.appendChild(g);
  const m = new Map();
  W[id].dies.forEach(d => {
    const r = s('rect', { class: 'cell', x: gx(d.die_x) + 1, y: gy(d.die_y) + 1, width: CELL - 2, height: CELL - 2, rx: 0, tabindex: -1 });
    r.addEventListener('mousemove', e => showTip(e, id, d));
    r.addEventListener('mouseleave', hideTip);
    r.addEventListener('click', () => { state.pin = d.die_x + ',' + d.die_y; paint(); renderDetail(); renderChart(); });
    g.appendChild(r); m.set(d.die_x + ',' + d.die_y, r);
  });
  const marks = s('g', { 'pointer-events': 'none' }); svg.appendChild(marks);
  cells[id] = m; svg._band = band; svg._marks = marks; svg._gx = gx; svg._gy = gy;
  return svg;
}

function colorOf(d) {
  if (state.mode === 'reason') return d.fail_type === 'none' ? 'var(--pass)' : 'var(--c-' + d.fail_type + ')';
  const sc = scaleFor(state.item);
  return rampAt((d[state.item] - sc.lo) / ((sc.hi - sc.lo) || 1));
}
function paint() {
  const spec = SPEC[state.item];
  IDS.forEach(id => {
    W[id].dies.forEach(d => {
      const r = cells[id].get(d.die_x + ',' + d.die_y);
      r.setAttribute('fill', colorOf(d));
      let dim = false;
      if (state.only) dim = d.fail_type !== state.only;
      r.classList.toggle('dim', dim);
    });
    const svg = maps[id];
    while (svg._band.firstChild) svg._band.removeChild(svg._band.firstChild);
    while (svg._marks.firstChild) svg._marks.removeChild(svg._marks.firstChild);
    if (state.mode === 'measure') {
      // 기준을 벗어난 다이: 칸 가운데 점 (진한 칸·옅은 칸 모두에서 보이도록 안쪽 흰 점 + 바깥 테두리)
      W[id].dies.forEach(d => {
        if (!spec.bad(d[state.item])) return;
        svg._marks.appendChild(s('circle', { cx: svg._gx(d.die_x) + CELL / 2, cy: svg._gy(d.die_y) + CELL / 2, r: 3.2,
          fill: 'var(--surface)', stroke: 'var(--ink)', 'stroke-width': 1.4 }));
      });
    }
    if (state.pin) {
      const [px, py] = state.pin.split(',').map(Number);
      svg._band.appendChild(s('rect', { x: PAD_L, y: svg._gy(py), width: N * CELL, height: CELL, fill: 'var(--grid)' }));
      svg._band.appendChild(s('rect', { x: svg._gx(px), y: PAD_T, width: CELL, height: N * CELL, fill: 'var(--grid)' }));
      if (cells[id].get(state.pin)) {   // 이중 테두리: 어떤 칸 색 위에서도 보인다
        const o = { x: svg._gx(px) - .5, y: svg._gy(py) - .5, width: CELL + 1, height: CELL + 1, rx: 0, fill: 'none' };
        svg._marks.appendChild(s('rect', Object.assign({ stroke: 'var(--ink)', 'stroke-width': 3 }, o)));
        svg._marks.appendChild(s('rect', Object.assign({ stroke: 'var(--surface)', 'stroke-width': 1 }, o)));
      }
    }
  });
  renderLegend();
}

const VARS = MEASURES.concat([{ key: 'radius_mm', label: '중심에서 거리', unit: 'mm', rule: '' }]);

const CHARTS = [['hist', '히스토그램'], ['scatter', '산점도'], ['bar', '막대그래프'], ['line', '꺾은선']];

function limitsOf(key) { const sp = SPEC[key]; return sp ? [sp.lo, sp.hi].filter(v => v !== undefined) : []; }
function niceTicks(lo, hi, n) {
  const span = (hi - lo) || 1, raw = span / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
  const a = Math.floor(lo / step + 1e-9) * step, b = Math.ceil(hi / step - 1e-9) * step, t = [];
  for (let v = a; v <= b + step * 1e-6; v += step) t.push(+v.toFixed(10));
  return { ticks: t, lo: t[0], hi: t[t.length - 1] };
}
const tickFmt = v => Math.abs(v) >= 1000 ? String(Math.round(v)) : String(+v.toPrecision(4));
const mean = a => a.reduce((x, y) => x + y, 0) / (a.length || 1);

function frame(o) {

  const sx = v => m.l + (v - o.x[0]) / ((o.x[1] - o.x[0]) || 1) * (Wd - m.l - m.r);
  const sy = v => Ht - m.b - (v - o.y[0]) / ((o.y[1] - o.y[0]) || 1) * (Ht - m.t - m.b);
  o.yt.forEach(t => {

  hd.appendChild(sw); hd.appendChild(document.createTextNode(id + ' · ' + text)); return hd;
}

// --- 히스토그램: 웨이퍼별 패널, 같은 구간·같은 y 눈금 ---
function chartHist(box) {
  const key = cs.hv, v = VAR[key], sc = scaleFor(key), nb = cs.bins, lo = sc.lo, hi = sc.hi, step = (hi - lo) / nb;
  const counts = IDS.map(id => {
    const c = new Array(nb).fill(0);
    W[id].dies.forEach(d => { let i = Math.floor((d[key] - lo) / step); c[Math.max(0, Math.min(nb - 1, i))]++; });
    return c;
  });
  const yt = niceTicks(0, Math.max(...counts.flat()), 4);
  const xt = niceTicks(lo, hi, 6).ticks.filter(t => t >= lo - 1e-9 && t <= hi + 1e-9).map(t => ({ v: t, t: tickFmt(t) }));
  const wrap = h('div', 'mini');
  IDS.forEach((id, i) => {
    const f = frame({ x: [lo, hi], y: [0, yt.hi], yt: yt.ticks, xt, xl: v.label + (v.unit ? ' (' + v.unit + ')' : ''), yl: '다이 수', label: id + ' ' + v.label + ' 히스토그램' });
    const bw = f.sx(lo + step) - f.sx(lo);
    counts[i].forEach((c, k) => {
      const x0 = f.sx(lo + k * step), w = Math.min(bw - 2, 24), x = x0 + (bw - w) / 2;
      if (c > 0) {
        const p = s('path', { d: barPath(x, f.sy(c), w, f.sy(0) - f.sy(c), 0), fill: WCOL[i] });
        f.svg.appendChild(p);
      }
      const hit = s('rect', { x: x0, y: f.m.t, width: bw, height: f.Ht - f.m.b - f.m.t, fill: 'transparent' });
      const a = lo + k * step, b = a + step, last = k === nb - 1;
      hit.addEventListener('pointermove', e => simpleTip(e, v.label + ' ' + tickFmt(+a.toPrecision(4)) + (last ? ' 이상' : ' ~ ' + tickFmt(+b.toPrecision(4))) + ' ' + v.unit,
        [{ color: WCOL[i], value: c + '개', text: id + ' (' + pct(c, W[id].dies.length) + ')' }]));
      hit.addEventListener('pointerleave', hideTip);
      f.svg.appendChild(hit);
    });
    limitsOf(key).forEach(L => { if (L >= lo && L <= hi) limitLine(f, 'x', L, '기준 ' + tickFmt(L)); });
    const box2 = h('div'); box2.appendChild(waferHead(id, i, v.label + ' 분포')); box2.appendChild(f.svg); wrap.appendChild(box2);
  });
  box.appendChild(wrap);
  legendItems(IDS.map((id, i) => ({ color: WCOL[i], text: id })).concat([{ color: 'var(--ink)', text: '합격 기준선', line: true }]));
  $('chartNote').textContent = '구간 ' + nb + '개, 두 웨이퍼가 같은 구간·같은 세로 눈금을 씁니다.' + (sc.clipped ? ' 마지막 구간은 ' + tickFmt(+hi.toPrecision(4)) + ' 이상(상위 2%)을 모두 포함합니다.' : '') + ' 합격 기준: ' + (v.rule || '없음') + ' ' + (v.rule ? v.unit : '');
  const rows = []; for (let k = 0; k < nb; k++) rows.push([tickFmt(+(lo + k * step).toPrecision(4)) + (k === nb - 1 ? ' 이상' : ' ~ ' + tickFmt(+(lo + (k + 1) * step).toPrecision(4))), ...counts.map(c => c[k])]);
  $('chartTable').replaceChildren(tableOf([v.label + ' 구간', ...IDS], rows));
}

// --- 산점도: 웨이퍼별 패널, 판정 사유 색, 가까운 점 찾기 ---
function chartScatter(box) {
  const kx = cs.sx, ky = cs.sy, vx = VAR[kx], vy = VAR[ky];
  const rng = k => { const a = [].concat(...IDS.map(id => W[id].dies.map(d => d[k]))); const lo = Math.min(...a), hi = Math.max(...a), pad = (hi - lo) * .04 || 1; return [lo >= 0 ? Math.max(0, lo - pad) : lo - pad, hi + pad]; };
  const rx = rng(kx), ry = rng(ky), tx = niceTicks(rx[0], rx[1], 6), ty = niceTicks(ry[0], ry[1], 5);
  const wrap = h('div', 'mini'); const rows = [];
  IDS.forEach((id, i) => {
    const f = frame({ x: [tx.lo, tx.hi], y: [ty.lo, ty.hi], yt: ty.ticks, xt: tx.ticks.map(t => ({ v: t, t: tickFmt(t) })),
      xl: vx.label + (vx.unit ? ' (' + vx.unit + ')' : ''), yl: vy.label + (vy.unit ? ' (' + vy.unit + ')' : ''), label: id + ' 산점도 ' + vx.label + ' 대 ' + vy.label });
    limitsOf(kx).forEach(L => limitLine(f, 'x', L, '기준 ' + tickFmt(L)));
    limitsOf(ky).forEach(L => limitLine(f, 'y', L, '기준 ' + tickFmt(L)));
    const dies = W[id].dies, pts = dies.map(d => ({ d, x: f.sx(d[kx]), y: f.sy(d[ky]) }));
    const g = s('g'); f.svg.appendChild(g);
    pts.filter(p => p.d.pass_fail === 'PASS').concat(pts.filter(p => p.d.pass_fail === 'FAIL')).forEach(p => {
      const fail = p.d.pass_fail === 'FAIL';
      g.appendChild(s('circle', { cx: p.x, cy: p.y, r: fail ? 4 : 3, fill: fail ? 'var(--c-' + p.d.fail_type + ')' : 'var(--passdot)', stroke: 'var(--surface)', 'stroke-width': 1.5 }));
    });
    const ring = s('circle', { r: 7, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 2, 'pointer-events': 'none', visibility: 'hidden' }); f.svg.appendChild(ring);
    if (state.pin && W[id].byPos.get(state.pin)) {
      const d = W[id].byPos.get(state.pin);
      f.svg.appendChild(s('circle', { cx: f.sx(d[kx]), cy: f.sy(d[ky]), r: 8, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 3, 'pointer-events': 'none' }));
    }
    const hitArea = s('rect', { x: f.m.l, y: f.m.t, width: f.Wd - f.m.l - f.m.r, height: f.Ht - f.m.t - f.m.b, fill: 'transparent' }); f.svg.appendChild(hitArea);
    const nearest = e => { const q = svgPoint(f.svg, e); let best = null, bd = 28 * 28; pts.forEach(p => { const dd = (p.x - q.x) ** 2 + (p.y - q.y) ** 2; if (dd < bd) { bd = dd; best = p; } }); return best; };
    hitArea.addEventListener('pointermove', e => { const p = nearest(e); if (!p) { ring.setAttribute('visibility', 'hidden'); hideTip(); return; }
      ring.setAttribute('cx', p.x); ring.setAttribute('cy', p.y); ring.setAttribute('visibility', 'visible'); showTip(e, id, p.d); });
    hitArea.addEventListener('pointerleave', () => { ring.setAttribute('visibility', 'hidden'); hideTip(); });
    hitArea.addEventListener('click', e => { const p = nearest(e); if (p) { state.pin = p.d.die_x + ',' + p.d.die_y; paint(); renderDetail(); renderChart(); } });
    const xs = dies.map(d => d[kx]), ys = dies.map(d => d[ky]), mx = mean(xs), my = mean(ys);
    const cov = mean(dies.map(d => (d[kx] - mx) * (d[ky] - my))), r = cov / (Math.sqrt(mean(xs.map(x => (x - mx) ** 2))) * Math.sqrt(mean(ys.map(y => (y - my) ** 2))));
    rows.push([id, dies.length, dies.filter(d => d.pass_fail === 'FAIL').length, fmt(mx, kx), fmt(my, ky), kx === ky ? '1.00' : r.toFixed(2)]);
    const box2 = h('div'); box2.appendChild(waferHead(id, i, vx.label + ' × ' + vy.label)); box2.appendChild(f.svg); wrap.appendChild(box2);
  });
  box.appendChild(wrap);
  const present = REASONS.map(([k, n]) => ({ color: 'var(--c-' + k + ')', text: n, ring: true })).filter(it => IDS.some(id => ST[id].byReason[it.color.slice(8, -1)]));
  legendItems([{ color: 'var(--passdot)', text: '합격', ring: true }].concat(present, [{ color: 'var(--ink)', text: '합격 기준선', line: true }]));
  $('chartNote').textContent = '점을 클릭하면 위의 맵과 다이 상세에서 같은 다이가 선택됩니다. 점 위에 포인터를 가까이 대면 가장 가까운 다이를 찾습니다. 상관계수는 참고용입니다.';
  $('chartTable').replaceChildren(tableOf(['웨이퍼', '다이 수', '불합격', vx.label + ' 평균', vy.label + ' 평균', '상관계수 r'], rows));
}

// --- 막대그래프: 분류(사유/zone) × 값(개수/비율), 웨이퍼별 묶음 ---
function chartBar(box) {
  const byReason = cs.bg === 'reason', cats = byReason ? REASONS.map(r => r[0]) : ZONES, count = cs.bv === 'count';
  const val = (id, c) => {
    const dies = W[id].dies;
    if (byReason) { const n = dies.filter(d => d.fail_type === c).length; return count ? n : 100 * n / dies.length; }
    const z = dies.filter(d => d.zone === c), n = z.filter(d => d.pass_fail === 'FAIL').length; return count ? n : 100 * n / z.length;
  };
  const data = IDS.map(id => cats.map(c => val(id, c)));
  const yt = niceTicks(0, Math.max(...data.flat(), count ? 1 : 1), 5);
  const f = frame({ x: [0, cats.length], y: [0, yt.hi], yt: yt.ticks, yf: t => count ? tickFmt(t) : tickFmt(t) + '%', xt: cats.map((c, i) => ({ v: i + .5, t: c })),
    xl: byReason ? '불합격 사유' : 'zone', yl: count ? '불합격 다이 수' : (byReason ? '전체 다이 중 비율' : '불합격률'), label: '막대그래프' });
  const band = f.sx(1) - f.sx(0), bw = Math.min(24, (band - 12) / IDS.length - 2);
  cats.forEach((c, k) => {
    const total = IDS.length * bw + (IDS.length - 1) * 2, x0 = f.sx(k) + (band - total) / 2;
    IDS.forEach((id, i) => {
      const v = data[i][k], x = x0 + i * (bw + 2);
      if (v > 0) f.svg.appendChild(s('path', { d: barPath(x, f.sy(v), bw, f.sy(0) - f.sy(v), 0), fill: WCOL[i] }));
      const t = s('text', { x: x + bw / 2, y: f.sy(v) - 5, 'text-anchor': 'middle' }); t.textContent = count ? String(v) : v.toFixed(1) + '%'; f.svg.appendChild(t);
    });
    const hit = s('rect', { x: f.sx(k), y: f.m.t, width: band, height: f.Ht - f.m.t - f.m.b, fill: 'transparent' });
    hit.addEventListener('pointermove', e => simpleTip(e, c, IDS.map((id, i) => ({ color: WCOL[i], value: count ? data[i][k] + '개' : data[i][k].toFixed(1) + '%', text: id }))));
    hit.addEventListener('pointerleave', hideTip); f.svg.appendChild(hit);
  });
  f.svg.style.maxWidth = '760px'; box.appendChild(f.svg);
  legendItems(IDS.map((id, i) => ({ color: WCOL[i], text: id })));
  $('chartNote').textContent = byReason ? '사유는 먼저 걸린 줄 하나로 판정되므로 한 다이가 두 번 세어지지 않습니다. 합격 다이는 포함하지 않습니다.' : '불합격률 = 그 zone의 불합격 다이 수 ÷ 그 zone의 다이 수.';
  $('chartTable').replaceChildren(tableOf([byReason ? '사유' : 'zone', ...IDS], cats.map((c, k) => [c, ...IDS.map((id, i) => count ? data[i][k] : data[i][k].toFixed(1) + '%')])));
}

// --- 꺾은선: 위치(거리·die_x·die_y)에 따른 불합격률 또는 평균 ---
function chartLine(box) {
  const xk = cs.lx, yk = cs.ly, fr = yk === 'failrate', v = VAR[yk];
  const xOf = d => xk === 'radius' ? Math.floor(d.radius_mm / 10) * 10 + 5 : d[xk === 'die_x' ? 'die_x' : 'die_y'];
  const series = IDS.map(id => {
    const m = new Map();
    W[id].dies.forEach(d => { const x = xOf(d); if (!m.has(x)) m.set(x, []); m.get(x).push(d); });
    return [...m.entries()].sort((a, b) => a[0] - b[0]).map(([x, ds]) => ({ x, n: ds.length, y: fr ? 100 * ds.filter(d => d.pass_fail === 'FAIL').length / ds.length : mean(ds.map(d => d[yk])) }));
  });
  const xs = [...new Set(series.flat().map(p => p.x))].sort((a, b) => a - b);
  const xd = xk === 'radius' ? [0, 140] : [Math.min(...xs) - 1, Math.max(...xs) + 1];
  const xt = (xk === 'radius' ? [0, 20, 40, 60, 80, 100, 120, 140] : niceTicks(xd[0], xd[1], 7).ticks.filter(t => t >= xd[0] && t <= xd[1])).map(t => ({ v: t, t: String(t) }));
  const all = series.flat().map(p => p.y), lims = fr ? [] : limitsOf(yk);
  const lo = fr ? 0 : Math.min(...all, ...lims), hi = Math.max(...all, ...lims), pad = fr ? 0 : (hi - lo) * .08;
  const yt = niceTicks(fr ? 0 : lo - pad, hi + pad, 5);
  const f = frame({ x: xd, y: [yt.lo, yt.hi], yt: yt.ticks, yf: t => fr ? tickFmt(t) + '%' : tickFmt(t),
    xt, xl: xk === 'radius' ? '중심에서 거리 (mm, 10mm 구간의 가운데 값)' : xk, yl: fr ? '불합격률' : v.label + ' 평균' + (v.unit ? ' (' + v.unit + ')' : ''), label: '꺾은선 그래프' });
  lims.forEach(L => { if (L >= yt.lo && L <= yt.hi) limitLine(f, 'y', L, '기준 ' + tickFmt(L)); });
  const cross = s('line', { y1: f.m.t, y2: f.Ht - f.m.b, stroke: 'var(--base)', 'stroke-width': 1, visibility: 'hidden', 'pointer-events': 'none' }); f.svg.appendChild(cross);
  series.forEach((pts, i) => {
    f.svg.appendChild(s('path', { d: pts.map((p, k) => (k ? 'L' : 'M') + f.sx(p.x) + ',' + f.sy(p.y)).join(''), fill: 'none', stroke: WCOL[i], 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    pts.forEach(p => f.svg.appendChild(s('circle', { cx: f.sx(p.x), cy: f.sy(p.y), r: 4, fill: WCOL[i], stroke: 'var(--surface)', 'stroke-width': 2, 'pointer-events': 'none' })));
  });
  const hit = s('rect', { x: f.m.l, y: f.m.t, width: f.Wd - f.m.l - f.m.r, height: f.Ht - f.m.t - f.m.b, fill: 'transparent' }); f.svg.appendChild(hit);
  hit.addEventListener('pointermove', e => {
    const q = svgPoint(f.svg, e); let bx = xs[0], bd = Infinity;
    xs.forEach(x => { const dd = Math.abs(f.sx(x) - q.x); if (dd < bd) { bd = dd; bx = x; } });
    cross.setAttribute('x1', f.sx(bx)); cross.setAttribute('x2', f.sx(bx)); cross.setAttribute('visibility', 'visible');
    const label = xk === 'radius' ? '거리 ' + (bx - 5) + ' ~ ' + (bx + 5) + ' mm' : xk + ' = ' + bx;
    simpleTip(e, label, IDS.map((id, i) => { const p = series[i].find(z => z.x === bx); return { color: WCOL[i], value: p ? (fr ? p.y.toFixed(1) + '%' : fmt(p.y, yk) + ' ' + v.unit) : '—', text: id + (p ? ' (다이 ' + p.n + '개)' : '') }; }));
  });
  hit.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); hideTip(); });
  f.svg.style.maxWidth = '760px'; box.appendChild(f.svg);
  legendItems(IDS.map((id, i) => ({ color: WCOL[i], text: id, line: true })).concat(lims.length ? [{ color: 'var(--ink)', text: '합격 기준선', line: true }] : []));
  $('chartNote').textContent = '구간마다 다이 수가 달라 ' + (fr ? '불합격률은 적은 다이로 계산된 구간에서 크게 흔들립니다. 포인터를 올리면 다이 수가 보입니다.' : '평균은 이상값에 끌려갑니다.');
  $('chartTable').replaceChildren(tableOf([xk === 'radius' ? '거리 구간 가운데(mm)' : xk, ...IDS.map(id => id + (fr ? ' 불합격률 (다이 수)' : ' 평균 (다이 수)'))],
    xs.map(x => [x, ...series.map(sr => { const p = sr.find(z => z.x === x); return p ? (fr ? p.y.toFixed(1) + '%' : fmt(p.y, yk)) + ' (' + p.n + ')' : '—'; })])));
}

function renderChart() {
  const seg = $('chartType'); seg.replaceChildren();
  CHARTS.forEach(([k, name]) => {
    const b = h('button', '', name); b.setAttribute('aria-pressed', String(cs.type === k));
    b.addEventListener('click', () => { cs.type = k; hideTip(); renderChart(); }); seg.appendChild(b);
  });
  const ctl = $('chartCtl'); ctl.replaceChildren();
  const vopts = VARS.map(x => [x.key, x.label + ' (' + x.key + ')']), mopts = MEASURES.map(x => [x.key, x.label + ' (' + x.key + ')']);
  const set = (k, fn) => val => { cs[k] = k === 'bins' ? Number(val) : val; fn ? fn() : 0; renderChart(); };
  if (cs.type === 'hist') { ctl.appendChild(sel('항목', vopts, cs.hv, set('hv'))); ctl.appendChild(sel('구간 수', [[10, '10'], [20, '20'], [40, '40']], cs.bins, set('bins'))); }
  if (cs.type === 'scatter') { ctl.appendChild(sel('가로축', vopts, cs.sx, set('sx'))); ctl.appendChild(sel('세로축', vopts, cs.sy, set('sy'))); }
  if (cs.type === 'bar') { ctl.appendChild(sel('분류', [['reason', '불합격 사유별'], ['zone', 'zone별']], cs.bg, set('bg'))); ctl.appendChild(sel('값', [['count', '불합격 개수'], ['rate', cs.bg === 'reason' ? '전체 대비 비율' : 'zone 안 불합격률']], cs.bv, set('bv'))); }
  if (cs.type === 'line') { ctl.appendChild(sel('가로축', [['radius', '중심에서 거리'], ['die_x', 'die_x'], ['die_y', 'die_y']], cs.lx, set('lx'))); ctl.appendChild(sel('세로축', [['failrate', '불합격률'], ...mopts], cs.ly, set('ly'))); }
  const box = $('chartBox'); box.replaceChildren();
  ({ hist: chartHist, scatter: chartScatter, bar: chartBar, line: chartLine })[cs.type](box);
}

// ---- 초기화 ----
$('sub').textContent = IDS.map(id => id + ' (' + W[id].lot + ', 다이 ' + W[id].dies.length + '개)').join(' vs ') + ' · 보기 전용';
buildCompare();
IDS.forEach(id => $('panels').appendChild(panel(id)));
buildTables();
MEASURES.forEach(m => { const o = h('option', '', m.label + ' (' + m.key + ')'); o.value = m.key; $('item').appendChild(o); });
$('item').value = state.item;
function setMode(m) {
  state.mode = m;
  $('mReason').setAttribute('aria-pressed', String(m === 'reason'));
  $('mMeasure').setAttribute('aria-pressed', String(m === 'measure'));
  $('measureBox').hidden = m !== 'measure';
  $('modeHint').textContent = m === 'reason' ? '범례를 누르면 그 사유만 강조됩니다.' : '두 웨이퍼가 같은 색 눈금을 씁니다.';
  paint();
}
$('mReason').addEventListener('click', () => setMode('reason'));
$('mMeasure').addEventListener('click', () => setMode('measure'));
$('item').addEventListener('change', e => { state.item = e.target.value; paint(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paint);
setMode('reason');
renderChart();
})();
</script>
